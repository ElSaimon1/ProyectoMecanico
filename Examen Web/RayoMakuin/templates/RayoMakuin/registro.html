{% extends 'RayoMakuin/base.html' %}
{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>

    <!-- links de bootstrap5 -->
    {% load bootstrap5 %}
    {% bootstrap_css %}
    {% bootstrap_javascript %}
</head>

<body>

    {% block content %}
    <link rel="stylesheet" type="text/css" href="{% static '../static/RayoMakuin/CSS/styleLogin.css' %}">

    <main class="container">
        <div class="row">
            <div class="col-md-4 offset-md-4 mt-5">
                <form action="{% url 'register' %}" method="post" class="card card-body ">
                    <h1 class="text-center">Creacion de Cuenta</h1>
                    {{error}}
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="username">Usuario:</label>
                        <input type="text" name="username" id="username" 
                        class="form-control" placeholder="Escriber tu Usuario">
                    </div>

                    <div class="mb-3">
                        <label for="password1">Contraseña:</label>
                        <input type="password" name="password1" id="password1" 
                        class="form-control" placeholder="Escriber tu Contraseña">
                    </div>

                    <div class="mb-3">
                        <label for="password2">Confirma tu Contraseña:</label>
                        <input type="password" name="password2" id="password2" 
                        class="form-control" placeholder="Confirma tu Contraseña">
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Crear Cuenta
                    </button>
                    <br>
                    <p>
                        <a href="{% url 'login' %}" style="color: crimson;">¿Ya Tengo Cuenta?</a>
                    </p>
                </form>
            </div>
        </div>
    </main>
    <br>
    {% endblock %}

</body>







</html>
